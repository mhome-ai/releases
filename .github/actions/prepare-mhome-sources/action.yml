name: Prepare ~/.mhome release worktrees
description: Fetch product source tags into sibling worktrees under ~/.mhome/work

inputs:
  version:
    required: true
  with_meowcore:
    default: "true"
  with_pallas:
    default: "false"
  baycat_version_mode:
    default: "match"
  source_token:
    required: false
    default: ""
  machine_lock:
    required: false
    default: ""

outputs:
  source_root:
    value: ${{ steps.prepare.outputs.source_root }}
  baycat_dir:
    value: ${{ steps.prepare.outputs.baycat_dir }}
  baycat_revision:
    value: ${{ steps.prepare.outputs.baycat_revision }}
  meowcore_dir:
    value: ${{ steps.prepare.outputs.meowcore_dir }}
  pallas_dir:
    value: ${{ steps.prepare.outputs.pallas_dir }}
  source_tag:
    value: ${{ steps.prepare.outputs.source_tag }}

runs:
  using: composite
  steps:
    - name: Acquire machine lock
      if: inputs.machine_lock != ''
      shell: bash
      run: bash "${{ github.action_path }}/../../scripts/ci/machine-lock.sh" acquire "${{ inputs.machine_lock }}"

    - name: Prepare sibling product worktrees
      id: prepare
      shell: bash
      env:
        RELEASE_SOURCE_TOKEN: ${{ inputs.source_token }}
      run: |
        set -euo pipefail
        extra=()
        [ "${{ inputs.with_meowcore }}" = "true" ] && extra+=(--with-meowcore)
        [ "${{ inputs.with_pallas }}" = "true" ] && extra+=(--with-pallas)
        node "${{ github.action_path }}/../../scripts/ci/prepare-release-sources.js" \
          --version "${{ inputs.version }}" \
          --work-id "${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}" \
          --baycat-version-mode "${{ inputs.baycat_version_mode }}" \
          "${extra[@]}"
