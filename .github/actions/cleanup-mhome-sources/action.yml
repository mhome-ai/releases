name: Remove ~/.mhome release worktrees
description: Drop the job-scoped product worktrees and release an optional machine lock

inputs:
  source_root:
    required: false
    default: ""
  machine_lock:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Remove release worktrees
      if: inputs.source_root != ''
      shell: bash
      run: node "${{ github.action_path }}/../../scripts/ci/cleanup-release-sources.js" "${{ inputs.source_root }}"

    - name: Release machine lock
      if: always() && inputs.machine_lock != ''
      shell: bash
      run: bash "${{ github.action_path }}/../../scripts/ci/machine-lock.sh" release "${{ inputs.machine_lock }}"
