name: Release Docker images

on:
  push:
    tags:
      - "d[0-9]*"

concurrency:
  group: docker-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  plan:
    runs-on: [self-hosted, Linux, ARM64, release-linux-arm64]
    outputs:
      artifact_dir: ${{ steps.release.outputs.artifact_dir }}
    steps:
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHANNEL: docker
          RELEASE_EXTRA: plan
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_DISTRIBUTION_BASE_URL: ${{ vars.DOCKER_DISTRIBUTION_BASE_URL }}
        run: |
          set -euo pipefail
          mhome="${MHOME_ROOT:-$HOME/.mhome}"
          releases="$mhome/releases"
          tag="${RELEASE_TAG:?}"
          [ -e "$releases/.git" ] || { echo "::error::runner is missing $releases"; exit 1; }
          git -C "$releases" fetch --prune origin
          git -C "$releases" fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          work="$mhome/work/${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          git -C "$releases" worktree add --detach "$work/releases" "$tag"
          export WORK_ROOT="$work" RELEASES_DIR="$work/releases" MHOME_ROOT="$mhome"
          bash "$work/releases/scripts/ci/run.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-release-plan
          path: ${{ steps.release.outputs.artifact_dir }}
          if-no-files-found: error

  build-amd64:
    needs: plan
    runs-on: [self-hosted, Linux, AMD64, release-linux-amd64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-release-plan
          path: ${{ runner.temp }}/docker-plan
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHANNEL: docker
          RELEASE_EXTRA: linux/amd64
          PLAN_DIR: ${{ runner.temp }}/docker-plan
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_DISTRIBUTION_BASE_URL: ${{ vars.DOCKER_DISTRIBUTION_BASE_URL }}
        run: |
          set -euo pipefail
          mhome="${MHOME_ROOT:-$HOME/.mhome}"
          releases="$mhome/releases"
          tag="${RELEASE_TAG:?}"
          [ -e "$releases/.git" ] || { echo "::error::runner is missing $releases"; exit 1; }
          git -C "$releases" fetch --prune origin
          git -C "$releases" fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          work="$mhome/work/${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          git -C "$releases" worktree add --detach "$work/releases" "$tag"
          export WORK_ROOT="$work" RELEASES_DIR="$work/releases" MHOME_ROOT="$mhome"
          bash "$work/releases/scripts/ci/run.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-amd64
          path: ${{ steps.release.outputs.artifact_dir }}
          if-no-files-found: error

  build-arm64:
    needs: plan
    runs-on: [self-hosted, Linux, ARM64, release-linux-arm64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-release-plan
          path: ${{ runner.temp }}/docker-plan
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHANNEL: docker
          RELEASE_EXTRA: linux/arm64
          PLAN_DIR: ${{ runner.temp }}/docker-plan
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_DISTRIBUTION_BASE_URL: ${{ vars.DOCKER_DISTRIBUTION_BASE_URL }}
        run: |
          set -euo pipefail
          mhome="${MHOME_ROOT:-$HOME/.mhome}"
          releases="$mhome/releases"
          tag="${RELEASE_TAG:?}"
          [ -e "$releases/.git" ] || { echo "::error::runner is missing $releases"; exit 1; }
          git -C "$releases" fetch --prune origin
          git -C "$releases" fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          work="$mhome/work/${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          git -C "$releases" worktree add --detach "$work/releases" "$tag"
          export WORK_ROOT="$work" RELEASES_DIR="$work/releases" MHOME_ROOT="$mhome"
          bash "$work/releases/scripts/ci/run.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-arm64
          path: ${{ steps.release.outputs.artifact_dir }}
          if-no-files-found: error

  merge:
    needs: [plan, build-amd64, build-arm64]
    runs-on: [self-hosted, Linux, ARM64, release-linux-arm64]
    environment: docker-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-release-plan
          path: ${{ runner.temp }}/docker-plan
      - uses: actions/download-artifact@v4
        with:
          name: docker-amd64
          path: ${{ runner.temp }}/docker-amd64
      - uses: actions/download-artifact@v4
        with:
          name: docker-arm64
          path: ${{ runner.temp }}/docker-arm64
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHANNEL: docker
          RELEASE_EXTRA: merge
          PLAN_DIR: ${{ runner.temp }}/docker-plan
          AMD64_DIGEST_DIR: ${{ runner.temp }}/docker-amd64/digests
          ARM64_DIGEST_DIR: ${{ runner.temp }}/docker-arm64/digests
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_DISTRIBUTION_BASE_URL: ${{ vars.DOCKER_DISTRIBUTION_BASE_URL }}
        run: |
          set -euo pipefail
          mhome="${MHOME_ROOT:-$HOME/.mhome}"
          releases="$mhome/releases"
          tag="${RELEASE_TAG:?}"
          [ -e "$releases/.git" ] || { echo "::error::runner is missing $releases"; exit 1; }
          git -C "$releases" fetch --prune origin
          git -C "$releases" fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          work="$mhome/work/${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          git -C "$releases" worktree add --detach "$work/releases" "$tag"
          export WORK_ROOT="$work" RELEASES_DIR="$work/releases" MHOME_ROOT="$mhome"
          bash "$work/releases/scripts/ci/run.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-release-manifest
          path: ${{ steps.release.outputs.artifact_dir }}
          if-no-files-found: error

  publish:
    needs: [plan, build-amd64, build-arm64, merge]
    runs-on: [self-hosted, Linux, ARM64, release-linux-arm64]
    environment: docker-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-release-plan
          path: ${{ runner.temp }}/docker-plan
      - uses: actions/download-artifact@v4
        with:
          name: docker-amd64
          path: ${{ runner.temp }}/docker-amd64
      - uses: actions/download-artifact@v4
        with:
          name: docker-arm64
          path: ${{ runner.temp }}/docker-arm64
      - uses: actions/download-artifact@v4
        with:
          name: docker-release-manifest
          path: ${{ runner.temp }}/docker-manifest
      - env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHANNEL: docker
          RELEASE_EXTRA: publish
          PLAN_DIR: ${{ runner.temp }}/docker-plan
          MANIFEST_PATH: ${{ runner.temp }}/docker-manifest/docker-release-manifest.json
          MEOWCTL_AMD64: ${{ runner.temp }}/docker-amd64/meowctl/meowctl
          MEOWCTL_ARM64: ${{ runner.temp }}/docker-arm64/meowctl/meowctl
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_DISTRIBUTION_BASE_URL: ${{ vars.DOCKER_DISTRIBUTION_BASE_URL }}
          DOCKER_DISTRIBUTION_BUCKET: ${{ vars.DOCKER_DISTRIBUTION_BUCKET }}
          DOCKER_DISTRIBUTION_PUBLISH_ROLE_ARN: ${{ vars.DOCKER_DISTRIBUTION_PUBLISH_ROLE_ARN }}
          DOCKER_CATALOG_PRIMARY_PRIVATE_KEY_B64: ${{ secrets.DOCKER_CATALOG_PRIMARY_PRIVATE_KEY_B64 }}
          DOCKER_CATALOG_SECONDARY_PRIVATE_KEY_B64: ${{ secrets.DOCKER_CATALOG_SECONDARY_PRIVATE_KEY_B64 }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          mhome="${MHOME_ROOT:-$HOME/.mhome}"
          releases="$mhome/releases"
          tag="${RELEASE_TAG:?}"
          [ -e "$releases/.git" ] || { echo "::error::runner is missing $releases"; exit 1; }
          git -C "$releases" fetch --prune origin
          git -C "$releases" fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          work="$mhome/work/${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          git -C "$releases" worktree add --detach "$work/releases" "$tag"
          export WORK_ROOT="$work" RELEASES_DIR="$work/releases" MHOME_ROOT="$mhome"
          bash "$work/releases/scripts/ci/run.sh"
