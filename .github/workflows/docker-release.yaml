name: Release Docker images

on:
  push:
    tags:
      - "dlr[0-9]*"
      - "dlx[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Product tag, for example dlr1.2.3"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  linux-arm64:
    if: ${{ startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'dlr') }}
    uses: ./.github/workflows/run-tagged.yaml
    environment: docker-release
    concurrency:
      group: docker-stable-linux-arm64
      cancel-in-progress: false
    with:
      runner_labels: '["self-hosted","Linux","ARM64","release-linux-arm64"]'
      channel: docker
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      work_suffix: linux-arm64
    secrets: inherit

  linux-amd64:
    if: ${{ startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'dlx') }}
    uses: ./.github/workflows/run-tagged.yaml
    environment: docker-release
    concurrency:
      group: docker-stable-linux-amd64
      cancel-in-progress: false
    with:
      runner_labels: '["self-hosted","Linux","AMD64","release-linux-amd64"]'
      channel: docker
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      work_suffix: linux-amd64
    secrets: inherit
