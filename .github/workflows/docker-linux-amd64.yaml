name: Release docker linux-x64

on:
  push:
    tags:
      - "dlx[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Product tag, for example dlx1.2.3"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/run-tagged.yaml
    concurrency:
      group: linux-docker-host
      cancel-in-progress: false
    with:
      runner_labels: '["self-hosted","Linux","AMD64","release-linux-amd64"]'
      channel: docker
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      work_suffix: linux-x64
    secrets: inherit
