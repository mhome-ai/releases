name: Release Camera ReID OSNet

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version pinned in camera-reid.lock.json. Bump that lock first.
        required: true
        default: true
        type: boolean

permissions:
  contents: write

defaults:
  run:
    working-directory: runtime-assets

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pack and optionally publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-camera-reid.sh "${{ inputs.publish }}"
