name: Release docker linux-arm64

on:
  push:
    tags:
      - "dlr[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Product tag, for example dlr1.2.3"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/run-tagged.yaml
    concurrency:
      group: linux-docker-host
      cancel-in-progress: false
    with:
      runner_labels: '["self-hosted","Linux","ARM64","release-linux-arm64"]'
      channel: docker
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      work_suffix: linux-arm64
    secrets: inherit
