name: Publish Developer Kit
on:
  workflow_dispatch:
    inputs:
      kit:
        type: choice
        options: [ui, extension, wave]
        required: true
      source_tag:
        description: Exact kit-<kit>-vX.Y.Z source tag
        type: string
        required: true
      source_commit:
        description: Full source commit matching the tag
        type: string
        required: true
      cli_version:
        description: Already released meow CLI version on all four Mac/Linux platforms
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: developer-kit-${{ inputs.kit }}
  cancel-in-progress: false
jobs:
  publish:
    uses: ./.github/workflows/run-developer-kit.yaml
    with:
      kit: ${{ inputs.kit }}
      source_tag: ${{ inputs.source_tag }}
      source_commit: ${{ inputs.source_commit }}
      cli_version: ${{ inputs.cli_version }}
    secrets: inherit
