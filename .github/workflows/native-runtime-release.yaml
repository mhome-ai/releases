name: Release native runtime

on:
  push:
    tags:
      - "nlr[0-9]*"
      - "nlx[0-9]*"
      - "nm[0-9]*"
      - "nw[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Product tag, for example nlr1.2.3"
        required: true
        type: string
      initialize_catalog:
        description: "Initialize a missing platform Stable Catalog"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  linux-arm64:
    if: ${{ startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'nlr') }}
    uses: ./.github/workflows/run-tagged.yaml
    environment: native-runtime-release
    concurrency:
      group: native-runtime-stable-linux-arm64
      cancel-in-progress: false
    with:
      runner_labels: '["self-hosted","Linux","ARM64","release-linux-arm64"]'
      channel: native
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      initialize_catalog: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_catalog || false }}
    secrets: inherit

  linux-amd64:
    if: ${{ startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'nlx') }}
    uses: ./.github/workflows/run-tagged.yaml
    environment: native-runtime-release
    concurrency:
      group: native-runtime-stable-linux-amd64
      cancel-in-progress: false
    with:
      runner_labels: '["self-hosted","Linux","AMD64","release-linux-amd64"]'
      channel: native
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      initialize_catalog: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_catalog || false }}
    secrets: inherit

  macos:
    if: ${{ startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'nm') }}
    uses: ./.github/workflows/run-tagged.yaml
    environment: native-runtime-release
    concurrency:
      group: native-runtime-stable-macos
      cancel-in-progress: false
    with:
      runner_labels: '["self-hosted","macOS","ARM64","release-macos-primary"]'
      channel: native
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      initialize_catalog: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_catalog || false }}
    secrets: inherit

  windows:
    if: ${{ startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'nw') }}
    uses: ./.github/workflows/run-tagged.yaml
    environment: native-runtime-release
    concurrency:
      group: native-runtime-stable-windows
      cancel-in-progress: false
    with:
      runner_labels: '["self-hosted","Windows","X64"]'
      channel: native
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      initialize_catalog: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_catalog || false }}
    secrets: inherit
