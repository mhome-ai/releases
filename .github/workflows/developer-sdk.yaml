name: Publish Plugin SDK
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Exact Integration sdk-plugin-vX.Y.Z tag
        type: string
        required: true
      source_commit:
        description: Full Integration source commit matching the tag
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: developer-plugin-sdk
  cancel-in-progress: false
jobs:
  publish:
    # The executor uses the original dispatch event to freeze the source.
    uses: ./.github/workflows/run-developer-sdk.yaml
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
