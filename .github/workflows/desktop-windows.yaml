name: Release desktop windows

on:
  push:
    tags:
      - "aw[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Product tag, for example aw1.2.3"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/run-tagged.yaml
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    with:
      runner_labels: '["self-hosted","Windows","X64"]'
      channel: desktop
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      github_environment: desktop-release
      work_suffix: windows
    secrets: inherit
