name: Release Kokoro model pack

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Immutable model pack to publish
        required: true
        type: choice
        options:
          - kokoro:v1.0-en
          - kokoro:v1.1-zh
      publish:
        description: Publish after validation (disable to run a smoke test only)
        required: true
        default: true
        type: boolean

permissions:
  contents: write

defaults:
  run:
    working-directory: runtime-assets

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate manifest and select release
        id: metadata
        shell: bash
        env:
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          scripts/verify-model-packs.sh
          echo "public_tag=$(jq -r --arg id "$MODEL_ID" '.packs[] | select(.id == $id) | .publicTag' model-packs.lock.json)" >> "$GITHUB_OUTPUT"
          echo "display_name=$(jq -r --arg id "$MODEL_ID" '.packs[] | select(.id == $id) | .displayName' model-packs.lock.json)" >> "$GITHUB_OUTPUT"
      - name: Download, verify, and assemble release
        shell: bash
        env:
          MODEL_ID: ${{ inputs.model_id }}
        run: scripts/prepare-model-pack.sh "$MODEL_ID" dist
      - name: Execute ONNX audio smoke test
        shell: bash
        env:
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.2.6 onnxruntime==1.22.1
          python scripts/smoke-kokoro-onnx.py "$MODEL_ID" dist
      - name: Preserve verified pack for recovery
        if: inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-pack-${{ steps.metadata.outputs.public_tag }}
          path: runtime-assets/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Enforce immutable release tags
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ steps.metadata.outputs.public_tag }}
        run: |
          set -euo pipefail
          if status="$(gh release view "$PUBLIC_TAG" --json tagName 2>&1)"; then
            echo "release already exists and will not be overwritten: $PUBLIC_TAG" >&2
            exit 1
          elif [[ "$status" != "release not found" ]]; then
            printf '%s\n' "$status" >&2
            exit 1
          fi
      - name: Publish immutable public model pack
        if: inputs.publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.metadata.outputs.public_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.metadata.outputs.display_name }}
          body: |
            Optional Kokoro ONNX model pack used by MeowCore.

            The acoustic model and voices are mirrored byte-for-byte from the pinned upstream release. Apache-2.0 model terms, MIT exporter attribution, a source receipt, and SHA-256 checksums are included.
          files: runtime-assets/dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: false
