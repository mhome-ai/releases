name: Release one native runtime platform

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      platform:
        required: true
        type: string
      initialize_catalog:
        type: boolean
        default: false

# One writer per platform Catalog, covering draft generation through promotion.
concurrency:
  group: native-runtime-stable-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

# GitHub Latest belongs to Desktop aX.Y.Z (Tauri latest.json).
# Native create/publish must pass --latest=false so runtime tags never steal Latest.
env:
  LC_ALL: "C"
  RUNTIME_RELEASE_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test orchestrator contract
        run: node --test scripts/ci/resolve-product-tag.test.js scripts/ci/prepare-release-sources.test.js

      - id: version
        name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          case "${{ inputs.platform }}" in
            macos) tag="nm${version}" ;;
            linux-arm64) tag="nlr${version}" ;;
            linux-amd64) tag="nlx${version}" ;;
            windows) tag="nw${version}" ;;
            *) echo "Invalid native platform" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  quality-gate:
    if: inputs.platform == 'macos'
    needs: prepare
    runs-on: [self-hosted, macOS, ARM64, release-macos-primary]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: ./.github/actions/prepare-mhome-sources
        id: release_sources
        with:
          version: ${{ needs.prepare.outputs.version }}
          with_meowcore: "true"
          with_pallas: "false"
          baycat_version_mode: "match"
          source_token: ${{ secrets.GPR_TOKEN_OVERRIDE || secrets.GPR_TOKEN }}
          machine_lock: macos-primary
      - name: Test runtime source and release tooling
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.release_sources.outputs.baycat_dir }}"
          cargo fmt --all -- --check
          cargo test --profile local-package -p runtime-release-verify
          cargo test --profile local-package -p client
          cargo test --profile local-package -p storage
          cargo check --profile local-package \
            -p meowhost --bin meowhostd \
            -p meowcore-service \
            -p camera \
            -p matter \
            -p llm \
            -p mac \
            -p audiobridge \
            -p storage
          node --test \
            scripts/bundle/prepare-bundled-tools.test.js \
            scripts/bundle/verified-download-cache.test.js \
            scripts/bundle/verified-download-consumers.test.js \
            scripts/lib/cargo-component-graph.test.js \
            scripts/lib/app-component-state.test.js \
            scripts/lib/component-version-policy.test.js \
            scripts/lib/ensure-meowcore-rust.test.js \
            scripts/ci/release-source-dependencies.test.js \
            scripts/ci/release-source-metadata.test.js \
            scripts/release/mac/macos-signing-policy.test.js
          node scripts/release/check-service-versions.js --release
          bash -n \
            scripts/ci/ci-verify-release-sources.sh \
            scripts/release/install-meow.sh \
            scripts/release/native/package-macos-runtime.sh \
            scripts/release/native/package-linux-runtime.sh \
            scripts/release/native/verify-macos-runtime-release.sh \
            scripts/release/native/verify-linux-runtime-release.sh
          bash scripts/release/native/verify-macos-runtime-release.test.sh
          bash scripts/release/native/verify-linux-runtime-release.test.sh
          bash scripts/release/native/test-install-meow.sh
          node scripts/release/native/generate-runtime-component-manifests.test.js
          node scripts/release/native/generate-runtime-catalog.test.js
          node --test \
            scripts/release/native/runtime-catalog-config.test.js \
            scripts/release/native/runtime-components.test.js \
            scripts/release/windows/windows-release.test.js \
            scripts/release/native/verify-github-release-assets.test.js
          bash scripts/ci/ci-verify-release-sources.test.sh

      - uses: ./.github/actions/cleanup-mhome-sources
        if: always()
        with:
          source_root: ${{ steps.release_sources.outputs.source_root }}
          machine_lock: macos-primary
  build-macos:
    if: inputs.platform == 'macos'
    needs: [prepare, quality-gate]
    runs-on: [self-hosted, macOS, ARM64, release-macos-primary]
    strategy:
      max-parallel: 1
      matrix:
        include:
          - target_label: darwin-arm64
            rust_target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: ./.github/actions/prepare-mhome-sources
        id: release_sources
        with:
          version: ${{ needs.prepare.outputs.version }}
          with_meowcore: "true"
          with_pallas: "false"
          baycat_version_mode: "match"
          source_token: ${{ secrets.GPR_TOKEN_OVERRIDE || secrets.GPR_TOKEN }}
          machine_lock: macos-primary
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.release_sources.outputs.baycat_dir }}"
          node scripts/release/native/runtime-catalog-config.js catalog-url >/dev/null
          node scripts/release/native/runtime-catalog-config.js signature-url >/dev/null
          node scripts/release/native/runtime-catalog-config.js public-key >/dev/null
          node scripts/release/native/runtime-catalog-config.js public-key-file >/dev/null
      - name: Prepare isolated Mac signing keychain
        shell: bash
        env:
          APPLE_CSC_LINK_B64: ${{ secrets.APPLE_CSC_LINK }}
          APPLE_CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_CSC_LINK_B64" ] || {
            echo "::error::Missing APPLE_CSC_LINK"
            exit 1
          }
          [ -n "$APPLE_CSC_KEY_PASSWORD" ] || {
            echo "::error::Missing APPLE_CSC_KEY_PASSWORD"
            exit 1
          }

          keychain="$RUNNER_TEMP/native-runtime-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.target_label }}.keychain-db"
          certificate="$RUNNER_TEMP/native-runtime-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.target_label }}.p12"
          original_keychains="$RUNNER_TEMP/native-runtime-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.target_label }}.keychains"
          keychain_password="$(openssl rand -hex 32)"

          umask 077
          security list-keychains -d user > "$original_keychains"
          printf '%s' "$APPLE_CSC_LINK_B64" | tr -d '\r\n ' | openssl base64 -d -A > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"

          search_list=("$keychain")
          while IFS= read -r entry; do
            entry="${entry#*\"}"
            entry="${entry%\"*}"
            [ -n "$entry" ] && search_list+=("$entry")
          done < "$original_keychains"
          security list-keychains -d user -s "${search_list[@]}"

      - name: Verify Mac signing environment
        shell: bash
        run: |
          set -euo pipefail
          bash "${{ steps.release_sources.outputs.baycat_dir }}/scripts/release/mac/check-mac-runner.sh" --skip-rust
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/native-runtime-codesign.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          printf '%s\n' 'int main(void){return 0;}' > "$smoke_dir/main.c"
          case "${{ matrix.rust_target }}" in
            aarch64-apple-darwin) arch=arm64 ;;
            *) echo "::error::Unsupported Mac Rust target"; exit 1 ;;
          esac
          cc -arch "$arch" -o "$smoke_dir/codesign-smoke" "$smoke_dir/main.c"
          bash "${{ steps.release_sources.outputs.baycat_dir }}/scripts/release/mac/codesign-mac-release.sh" \
            --force \
            --options runtime \
            "$smoke_dir/codesign-smoke"
          codesign --verify --strict --verbose=2 "$smoke_dir/codesign-smoke"

      - name: Build and sign native components
        shell: bash
        run: |
          cd "${{ steps.release_sources.outputs.baycat_dir }}"
          bash scripts/release/native/package-macos-runtime.sh \
            "${{ matrix.target_label }}" \
            "${{ matrix.rust_target }}" \
            "build/native-runtime/${{ matrix.target_label }}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ inputs.platform }}-runtime-${{ matrix.target_label }}
          path: ${{ steps.release_sources.outputs.baycat_dir }}/build/native-runtime/${{ matrix.target_label }}/*
          if-no-files-found: error

      - name: Remove isolated Mac signing keychain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/native-runtime-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.target_label }}.keychain-db"
          certificate="$RUNNER_TEMP/native-runtime-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.target_label }}.p12"
          original_keychains="$RUNNER_TEMP/native-runtime-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.target_label }}.keychains"

          if [ -s "$original_keychains" ]; then
            search_list=()
            while IFS= read -r entry; do
              entry="${entry#*\"}"
              entry="${entry%\"*}"
              [ -n "$entry" ] && search_list+=("$entry")
            done < "$original_keychains"
            [ "${#search_list[@]}" -eq 0 ] || security list-keychains -d user -s "${search_list[@]}"
          fi
          [ ! -f "$keychain" ] || security delete-keychain "$keychain"
          rm -f "$certificate" "$original_keychains"

      - uses: ./.github/actions/cleanup-mhome-sources
        if: always()
        with:
          source_root: ${{ steps.release_sources.outputs.source_root }}
          machine_lock: macos-primary
  build-linux:
    if: ${{ inputs.platform == 'linux-arm64' || inputs.platform == 'linux-amd64' }}
    needs: prepare
    runs-on: ${{ inputs.platform == 'linux-arm64' && fromJSON('["self-hosted","Linux","ARM64","release-linux-arm64"]') || fromJSON('["self-hosted","Linux","AMD64","release-linux-amd64"]') }}
    env:
      # Persisted by each self-hosted Linux runner named volume.
      MHOME_DOWNLOAD_CACHE_ROOT: /home/runner/.cache/mhome-downloads
      RUST_TARGET: ${{ inputs.platform == 'linux-arm64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Install Linux native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libssl-dev \
            libpcap-dev \
            libsqlite3-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            protobuf-compiler \
            zstd \
            file

      - uses: ./.github/actions/prepare-mhome-sources
        id: release_sources
        with:
          version: ${{ needs.prepare.outputs.version }}
          with_meowcore: "true"
          with_pallas: "false"
          baycat_version_mode: "match"
          source_token: ${{ secrets.GPR_TOKEN_OVERRIDE || secrets.GPR_TOKEN }}
          machine_lock: ""
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.release_sources.outputs.baycat_dir }}"
          node scripts/release/native/runtime-catalog-config.js catalog-url >/dev/null
          node scripts/release/native/runtime-catalog-config.js signature-url >/dev/null
          node scripts/release/native/runtime-catalog-config.js public-key >/dev/null
          node scripts/release/native/runtime-catalog-config.js public-key-file >/dev/null
      - name: Test Linux runtime and Client
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.release_sources.outputs.baycat_dir }}"
          cargo test --profile local-package -p runtime-release-verify
          cargo test --profile local-package -p client

      - name: Build native Linux components
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.release_sources.outputs.baycat_dir }}"
          bash scripts/release/native/package-linux-runtime.sh \
            "${{ inputs.platform }}" \
            "${{ env.RUST_TARGET }}" \
            "build/native-runtime/${{ inputs.platform }}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ inputs.platform }}-runtime-${{ inputs.platform }}
          path: ${{ steps.release_sources.outputs.baycat_dir }}/build/native-runtime/${{ inputs.platform }}/*
          if-no-files-found: error

      - uses: ./.github/actions/cleanup-mhome-sources
        if: always()
        with:
          source_root: ${{ steps.release_sources.outputs.source_root }}
          machine_lock: ""
  build-windows:
    if: inputs.platform == 'windows'
    needs: prepare
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/prepare-mhome-sources
        id: release_sources
        with:
          version: ${{ needs.prepare.outputs.version }}
          with_meowcore: "true"
          with_pallas: "false"
          baycat_version_mode: "match"
          source_token: ${{ secrets.GPR_TOKEN_OVERRIDE || secrets.GPR_TOKEN }}
          machine_lock: ""
      - name: Test Windows runtime and Client
        shell: pwsh
        working-directory: ${{ steps.release_sources.outputs.baycat_dir }}
        run: |
          cargo test --profile local-package --locked -p runtime-release-verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --profile local-package --locked -p client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/release/windows/windows-release.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install CodeSignTool
        id: codesign_tool
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP ('meow-codesign-' + [guid]::NewGuid())
          $zip = $toolRoot + '.zip'
          Invoke-WebRequest -Uri 'https://www.ssl.com/download/codesigntool-for-windows/' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $toolRoot -Force
          Remove-Item -LiteralPath $zip
          "home=$toolRoot" >> $env:GITHUB_OUTPUT

      - name: Package signed Windows Client
        shell: pwsh
        working-directory: ${{ steps.release_sources.outputs.baycat_dir }}
        env:
          CODESIGNTOOL_HOME: ${{ steps.codesign_tool.outputs.home }}
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
        run: |
          ./scripts/release/native/package-windows-runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ inputs.platform }}-runtime-windows-x64
          path: ${{ steps.release_sources.outputs.baycat_dir }}/build/native-runtime/windows-x64/*.tar.gz
          if-no-files-found: error
      - uses: ./.github/actions/cleanup-mhome-sources
        if: always()
        with:
          source_root: ${{ steps.release_sources.outputs.source_root }}
          machine_lock: ""
  create-draft:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') && (needs.build-macos.result == 'success' || needs.build-linux.result == 'success' || needs.build-windows.result == 'success') && !contains(needs.*.result, 'cancelled') }}
    needs: [prepare, build-macos, build-linux, build-windows]
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          pattern: native-${{ inputs.platform }}-runtime-*
          path: build/native-runtime-assets
          merge-multiple: true

      - uses: ./.github/actions/prepare-mhome-sources
        id: release_sources
        with:
          version: ${{ needs.prepare.outputs.version }}
          with_meowcore: "true"
          source_token: ${{ secrets.GPR_TOKEN_OVERRIDE || secrets.GPR_TOKEN }}

      - name: Generate and sign Catalog
        shell: bash
        env:
          RUNTIME_CATALOG_PRIVATE_KEY_B64: ${{ secrets.RUNTIME_CATALOG_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libarchive-tools minisign
          [ -n "$RUNTIME_CATALOG_PRIVATE_KEY_B64" ] || {
            echo "::error::Missing RUNTIME_CATALOG_PRIVATE_KEY_B64"
            exit 1
          }
          mkdir -p build/runtime-catalog/tooling
          ln -s "$(command -v bsdtar)" build/runtime-catalog/tooling/tar
          export PATH="$PWD/build/runtime-catalog/tooling:$PATH"
          tar --version
          previous_args=()
          baycat="${{ steps.release_sources.outputs.baycat_dir }}"
          catalog_url="$(node "$baycat/scripts/release/native/runtime-catalog-config.js" catalog-url "${{ inputs.platform }}")"
          signature_url="$(node "$baycat/scripts/release/native/runtime-catalog-config.js" signature-url "${{ inputs.platform }}")"
          fetch_status() {
            local url="$1"
            local output="$2"
            local status
            status="$(curl --location --silent --show-error \
              --output "$output" \
              --write-out '%{http_code}' \
              "$url")" || {
                echo "::error::Failed to fetch $url" >&2
                exit 1
              }
            printf '%s' "$status"
          }
          catalog_status="$(fetch_status \
            "$catalog_url" \
            build/runtime-catalog/previous-catalog.json)"
          signature_status="$(fetch_status \
            "$signature_url" \
            build/runtime-catalog/previous-catalog.json.minisig)"
          if [ "$catalog_status" = "200" ] && [ "$signature_status" = "200" ]; then
            node "$baycat/scripts/release/native/runtime-catalog-config.js" public-key-file \
              > build/runtime-catalog/catalog.pub
            minisign -Vm build/runtime-catalog/previous-catalog.json \
              -x build/runtime-catalog/previous-catalog.json.minisig \
              -p build/runtime-catalog/catalog.pub
            previous_args=(
              --previous-catalog build/runtime-catalog/previous-catalog.json
            )
          elif { [ "$catalog_status" = "404" ] || [ "$catalog_status" = "403" ]; } \
            && { [ "$signature_status" = "404" ] || [ "$signature_status" = "403" ]; } \
            && [ "${{ inputs.initialize_catalog }}" = "true" ]; then
            echo "No Stable Catalog exists; creating the initial Runtime Catalog."
            rm -f \
              build/runtime-catalog/previous-catalog.json \
              build/runtime-catalog/previous-catalog.json.minisig
          else
            echo "::error::Stable Catalog is incomplete or unavailable (catalog HTTP $catalog_status, signature HTTP $signature_status)"
            echo "::error::The first release must be a manual workflow_dispatch with initialize_catalog=true."
            exit 1
          fi
          node "$baycat/scripts/release/native/generate-runtime-catalog.js" \
            --platform "${{ inputs.platform }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repository "$RUNTIME_RELEASE_REPO" \
            --source-repository "mhome-ai/baycat" \
            --source-revision "${{ steps.release_sources.outputs.baycat_revision }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --meowcore-repository "mhome-ai/meowcore-rust" \
            --meowcore-revision "$(node "$baycat/scripts/ci/release-source-dependencies.js" show --file "$baycat/release/sources/dependencies.json" --field commit)" \
            --meowcore-tag "$(node "$baycat/scripts/ci/release-source-dependencies.js" show --file "$baycat/release/sources/dependencies.json" --field tag)" \
            --assets-dir build/native-runtime-assets \
            --runtime-alternatives true \
            --output build/runtime-catalog/catalog.json \
            --publish-assets-output build/runtime-catalog/publish-assets.txt \
            "${previous_args[@]}"
          printf '%s' "$RUNTIME_CATALOG_PRIVATE_KEY_B64" | base64 --decode > build/runtime-catalog/catalog.key
          minisign -Sm build/runtime-catalog/catalog.json \
            -s build/runtime-catalog/catalog.key \
            -x build/runtime-catalog/catalog.json.minisig
          rm -f build/runtime-catalog/catalog.key

      - name: Preserve signed Catalog for verification and promotion
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ inputs.platform }}-runtime-catalog
          path: |
            build/runtime-catalog/catalog.json
            build/runtime-catalog/catalog.json.minisig
          if-no-files-found: error

      - name: Create or refresh draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          release_files=(
            build/runtime-catalog/catalog.json
            build/runtime-catalog/catalog.json.minisig
          )
          while IFS= read -r file_name; do
            [ -n "$file_name" ] || continue
            release_files+=("build/native-runtime-assets/$file_name")
          done < build/runtime-catalog/publish-assets.txt
          if gh release view "$tag" --repo "$RUNTIME_RELEASE_REPO" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --repo "$RUNTIME_RELEASE_REPO" --json isDraft --jq .isDraft)"
            if [ "$is_draft" = "true" ]; then
              gh release upload "$tag" \
                --repo "$RUNTIME_RELEASE_REPO" \
                --clobber \
                "${release_files[@]}"
            else
              echo "Release $tag is already public; assets will be verified but never modified."
            fi
          else
            gh release create "$tag" \
              --repo "$RUNTIME_RELEASE_REPO" \
              --draft \
              --latest=false \
              --title "MeowLink Runtime ${{ needs.prepare.outputs.version }}" \
              --notes "Native MeowLink runtime ${{ needs.prepare.outputs.version }}" \
              "${release_files[@]}"
          fi

      - name: Stage Catalog for remote verification
        run: cp build/runtime-catalog/catalog*.json build/runtime-catalog/catalog*.json.minisig build/native-runtime-assets/

      - name: Verify GitHub release asset digests
        uses: actions/github-script@v8
        env:
          RELEASE_REPOSITORY: ${{ env.RUNTIME_RELEASE_REPO }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ASSETS_DIR: build/native-runtime-assets
          RELEASE_VERIFY_DIR: build/runtime-release-verify
          BAYCAT_DIR: ${{ steps.release_sources.outputs.baycat_dir }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const verify = require(`${process.env.BAYCAT_DIR}/scripts/release/native/verify-github-release-assets.js`);
            await verify.verifyGitHubReleaseAssets({
              github,
              repository: process.env.RELEASE_REPOSITORY,
              tag: process.env.RELEASE_TAG,
              assetsDir: process.env.RELEASE_ASSETS_DIR,
              stagingDir: process.env.RELEASE_VERIFY_DIR,
            });

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ inputs.platform }}-verified-assets
          path: build/runtime-release-verify/*
          if-no-files-found: error

      - uses: ./.github/actions/cleanup-mhome-sources
        if: always()
        with:
          source_root: ${{ steps.release_sources.outputs.source_root }}

  verify-draft:
    # Reference needs.*.result so skipped sibling builds do not skip this job.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.create-draft.result == 'success' && inputs.platform == 'macos' }}
    needs: [prepare, create-draft]
    runs-on: [self-hosted, macOS, ARM64, release-macos-primary]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          name: native-${{ inputs.platform }}-verified-assets
          path: build/runtime-workflow-assets
          merge-multiple: true

      - uses: ./.github/actions/prepare-mhome-sources
        id: release_sources
        with:
          version: ${{ needs.prepare.outputs.version }}
          with_meowcore: "true"
          with_pallas: "false"
          baycat_version_mode: "match"
          source_token: ${{ secrets.GPR_TOKEN_OVERRIDE || secrets.GPR_TOKEN }}
          machine_lock: macos-primary
      - name: Verify signed Catalog metadata
        shell: bash
        run: |
          set -euo pipefail
          assets_dir="$GITHUB_WORKSPACE/build/runtime-workflow-assets"
          node "${{ steps.release_sources.outputs.baycat_dir }}/scripts/release/native/runtime-catalog-config.js" public-key-file \
            > "$assets_dir/catalog.pub"
          cargo run --profile local-package --quiet \
            --manifest-path "${{ steps.release_sources.outputs.baycat_dir }}/Cargo.toml" \
            -p runtime-release-verify \
            --bin runtime-release-verify \
            -- \
            --catalog "$assets_dir/catalog.json" \
            --signature "$assets_dir/catalog.json.minisig" \
            --public-key "$assets_dir/catalog.pub"

      - name: Verify signed Catalog, archives, and Apple signatures
        shell: bash
        run: |
          set -euo pipefail
          assets_dir="$GITHUB_WORKSPACE/build/runtime-workflow-assets"
          node "${{ steps.release_sources.outputs.baycat_dir }}/scripts/release/native/runtime-catalog-config.js" public-key-file \
            > "$assets_dir/catalog.pub"
          bash "${{ steps.release_sources.outputs.baycat_dir }}/scripts/release/native/verify-macos-runtime-release.sh" \
            "$assets_dir" \
            "$assets_dir/catalog.json" \
            "$assets_dir/catalog.json.minisig" \
            "$assets_dir/catalog.pub"

      - uses: ./.github/actions/cleanup-mhome-sources
        if: always()
        with:
          source_root: ${{ steps.release_sources.outputs.source_root }}
          machine_lock: macos-primary
  verify-linux:
    # nlr and nlx are independent publishes. create-draft already ran; do not
    # inherit skips from the unused macos/windows build jobs.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.create-draft.result == 'success' && (inputs.platform == 'linux-arm64' || inputs.platform == 'linux-amd64') }}
    needs: [prepare, create-draft]
    runs-on: ${{ inputs.platform == 'linux-arm64' && fromJSON('["self-hosted","Linux","ARM64","release-linux-arm64"]') || fromJSON('["self-hosted","Linux","AMD64","release-linux-amd64"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          name: native-${{ inputs.platform }}-verified-assets
          path: build/runtime-workflow-assets
          merge-multiple: true

      - uses: ./.github/actions/prepare-mhome-sources
        id: release_sources
        with:
          version: ${{ needs.prepare.outputs.version }}
          with_meowcore: "true"
          source_token: ${{ secrets.GPR_TOKEN_OVERRIDE || secrets.GPR_TOKEN }}

      - name: Verify signed Catalog, archives, and ELF architecture
        shell: bash
        run: |
          set -euo pipefail
          assets_dir="$GITHUB_WORKSPACE/build/runtime-workflow-assets"
          baycat="${{ steps.release_sources.outputs.baycat_dir }}"
          node "$baycat/scripts/release/native/runtime-catalog-config.js" public-key-file \
            > "$assets_dir/catalog.pub"
          bash "$baycat/scripts/release/native/verify-linux-runtime-release.sh" \
            "$assets_dir" \
            "$assets_dir/catalog.json" \
            "$assets_dir/catalog.json.minisig" \
            "$assets_dir/catalog.pub"

      - uses: ./.github/actions/cleanup-mhome-sources
        if: always()
        with:
          source_root: ${{ steps.release_sources.outputs.source_root }}

  verify-windows:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.create-draft.result == 'success' && inputs.platform == 'windows' }}
    needs: [prepare, create-draft]
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ inputs.platform }}-verified-assets
          path: build/runtime-workflow-assets
          merge-multiple: true
      - uses: ./.github/actions/prepare-mhome-sources
        id: release_sources
        with:
          version: ${{ needs.prepare.outputs.version }}
          with_meowcore: "true"
          with_pallas: "false"
          baycat_version_mode: "match"
          source_token: ${{ secrets.GPR_TOKEN_OVERRIDE || secrets.GPR_TOKEN }}
          machine_lock: ""
      - name: Verify signed Catalog and Windows Client
        shell: pwsh
        working-directory: ${{ steps.release_sources.outputs.baycat_dir }}
        run: |
          $assets = Join-Path $env:GITHUB_WORKSPACE 'build/runtime-workflow-assets'
          $key = node scripts/release/native/runtime-catalog-config.js public-key-file
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.File]::WriteAllText((Join-Path $assets 'catalog.pub'), ($key -join "`n"))
          ./scripts/release/native/verify-windows-runtime-release.ps1 -AssetsDirectory $assets -Catalog (Join-Path $assets 'catalog.json') -Signature (Join-Path $assets 'catalog.json.minisig') -PublicKey (Join-Path $assets 'catalog.pub')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: ./.github/actions/cleanup-mhome-sources
        if: always()
        with:
          source_root: ${{ steps.release_sources.outputs.source_root }}
          machine_lock: ""
  promote:
    # One platform verify is enough. The other verify jobs are skipped on purpose.
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') && (needs.verify-draft.result == 'success' || needs.verify-linux.result == 'success' || needs.verify-windows.result == 'success') && !contains(needs.*.result, 'cancelled') }}
    needs: [prepare, verify-draft, verify-linux, verify-windows]
    runs-on: ubuntu-latest
    environment: native-runtime-release
    steps:
      - uses: actions/checkout@v4

      - name: Download verified release metadata
        uses: actions/download-artifact@v4
        with:
          name: native-${{ inputs.platform }}-runtime-catalog
          path: build/runtime-release-promote

      - name: Configure AWS credentials through GitHub OIDC
        if: ${{ vars.RUNTIME_PUBLISH_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.RUNTIME_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Require Runtime publish role
        if: ${{ vars.RUNTIME_PUBLISH_ROLE_ARN == '' }}
        run: |
          echo "::error::Missing repository variable RUNTIME_PUBLISH_ROLE_ARN"
          exit 1

      - name: Publish immutable Catalog
        shell: bash
        env:
          RUNTIME_CATALOG_BUCKET: ${{ secrets.RUNTIME_CATALOG_BUCKET }}
        run: |
          set -euo pipefail
          [ -n "$RUNTIME_CATALOG_BUCKET" ] || { echo "::error::Missing RUNTIME_CATALOG_BUCKET"; exit 1; }
          version="${{ needs.prepare.outputs.version }}"
          verify_or_publish_immutable() {
            local source="$1"
            local key="$2"
            local content_type="$3"
            local existing
            local head_error
            existing="$(mktemp)"
            head_error="$(mktemp)"
            if aws s3api head-object \
              --bucket "$RUNTIME_CATALOG_BUCKET" \
              --key "$key" >/dev/null 2>"$head_error"; then
              aws s3 cp "s3://${RUNTIME_CATALOG_BUCKET}/${key}" "$existing" --only-show-errors
              if ! cmp -s "$source" "$existing"; then
                echo "::error::Immutable Runtime Catalog object already exists with different bytes: s3://${RUNTIME_CATALOG_BUCKET}/${key}"
                rm -f "$existing" "$head_error"
                exit 1
              fi
              echo "Immutable Runtime Catalog object already exists with identical bytes: s3://${RUNTIME_CATALOG_BUCKET}/${key}"
              rm -f "$existing" "$head_error"
              return
            fi
            if ! grep -Eq '(^|[^0-9])404([^0-9]|$)|Not Found|NoSuchKey' "$head_error"; then
              echo "::error::Unable to determine whether immutable Runtime Catalog object exists: s3://${RUNTIME_CATALOG_BUCKET}/${key}"
              cat "$head_error" >&2
              rm -f "$existing" "$head_error"
              exit 1
            fi
            rm -f "$existing" "$head_error"
            aws s3 cp "$source" "s3://${RUNTIME_CATALOG_BUCKET}/${key}" \
              --content-type "$content_type" \
              --cache-control 'public,max-age=31536000,immutable'
          }
          verify_or_publish_immutable \
            build/runtime-release-promote/catalog.json \
            "runtime/catalogs/${{ inputs.platform }}/${version}/catalog.json" \
            application/json
          verify_or_publish_immutable \
            build/runtime-release-promote/catalog.json.minisig \
            "runtime/catalogs/${{ inputs.platform }}/${version}/catalog.json.minisig" \
            application/octet-stream

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          is_draft="$(gh release view "$tag" --repo "$RUNTIME_RELEASE_REPO" --json isDraft --jq .isDraft)"
          if [ "$is_draft" = "true" ]; then
            gh release edit "$tag" --repo "$RUNTIME_RELEASE_REPO" --draft=false --latest=false
          fi

      - name: Verify public release metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          base_url="https://github.com/${RUNTIME_RELEASE_REPO}/releases/download/${tag}"
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          curl --fail --location --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
            "$base_url/catalog.json" \
            --output "$verification_dir/catalog.json"
          curl --fail --location --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
            "$base_url/catalog.json.minisig" \
            --output "$verification_dir/catalog.json.minisig"
          cmp -s build/runtime-release-promote/catalog.json "$verification_dir/catalog.json"
          cmp -s build/runtime-release-promote/catalog.json.minisig "$verification_dir/catalog.json.minisig"

      - name: Promote stable Catalog
        shell: bash
        env:
          RUNTIME_CATALOG_BUCKET: ${{ secrets.RUNTIME_CATALOG_BUCKET }}
        run: |
          set -euo pipefail
          # Upload the signature first. Clients retry a complete pair if they observe the brief switch window.
          aws s3 cp build/runtime-release-promote/catalog.json.minisig \
            "s3://${RUNTIME_CATALOG_BUCKET}/runtime/stable/${{ inputs.platform }}/catalog.json.minisig" \
            --content-type application/octet-stream \
            --cache-control 'no-cache,max-age=0'
          aws s3 cp build/runtime-release-promote/catalog.json \
            "s3://${RUNTIME_CATALOG_BUCKET}/runtime/stable/${{ inputs.platform }}/catalog.json" \
            --content-type application/json \
            --cache-control 'no-cache,max-age=0'

          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          aws s3 cp \
            "s3://${RUNTIME_CATALOG_BUCKET}/runtime/stable/${{ inputs.platform }}/catalog.json" \
            "$verification_dir/catalog.json" \
            --only-show-errors
          aws s3 cp \
            "s3://${RUNTIME_CATALOG_BUCKET}/runtime/stable/${{ inputs.platform }}/catalog.json.minisig" \
            "$verification_dir/catalog.json.minisig" \
            --only-show-errors
          cmp -s build/runtime-release-promote/catalog.json "$verification_dir/catalog.json" || {
            echo "::error::Stable Runtime Catalog differs after S3 promotion"
            exit 1
          }
          cmp -s build/runtime-release-promote/catalog.json.minisig "$verification_dir/catalog.json.minisig" || {
            echo "::error::Stable Runtime Catalog signature differs after S3 promotion"
            exit 1
          }
