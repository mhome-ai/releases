name: Publish Meow image linux-arm64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Native Linux ARM64 release, for example nlr1.0.2"
        required: true
        type: string
      image_version:
        description: "Image version, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/run-tagged.yaml
    concurrency:
      group: linux-docker-host
      cancel-in-progress: false
    with:
      runner_labels: '["self-hosted","Linux","ARM64","release-linux-arm64"]'
      channel: image
      tag: ${{ inputs.tag }}
      image_version: ${{ inputs.image_version }}
      orchestrator_ref: ${{ github.sha }}
      work_suffix: linux-arm64
    secrets: inherit
