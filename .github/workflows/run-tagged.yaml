name: Run tagged orchestrator

on:
  workflow_call:
    inputs:
      runner_labels:
        required: true
        type: string
      channel:
        required: true
        type: string
      tag:
        required: true
        type: string
      initialize_catalog:
        required: false
        type: boolean
        default: false
      orchestrator_ref:
        required: false
        type: string
        default: ""
      work_suffix:
        required: false
        type: string
        default: ""

jobs:
  run:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 480
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      WORK_SUFFIX: ${{ inputs.work_suffix }}
    steps:
      - name: Prepare a disposable Linux image builder
        if: runner.os == 'Linux' && inputs.channel == 'native'
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          use: false
          driver-opts: default-load=true
          keep-state: false
          cleanup: true
      - name: Prepare cached Linux desktop image builder
        if: runner.os == 'Linux' && inputs.channel == 'desktop'
        id: desktop-buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
          use: false
          cleanup: false
      - name: Fetch tagged orchestrator
        id: snapshot
        shell: bash
        env:
          ORCHESTRATOR_REF: ${{ inputs.orchestrator_ref }}
        run: |
          set -euo pipefail
          case "$RELEASE_CHANNEL" in plugin) echo "Plugin releases require run-tagged-plugin.yaml" >&2; exit 1 ;; esac
          if [ "$(uname -s)" = Darwin ]; then
            export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          fi
          mhome="${MHOME_ROOT:-$HOME/.mhome}"
          releases="$mhome/releases"
          tag="${RELEASE_TAG:?}"
          [ -e "$releases/.git" ] || {
            echo "::error::runner is missing $releases; provision ~/.mhome on this machine"
            exit 1
          }
          git -C "$releases" fetch --prune origin
          work_id="${GITHUB_RUN_ID}-${WORK_SUFFIX:-$GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          work="$mhome/work/${work_id}"
          mkdir -p "$mhome/work"
          mkdir "$work"
          printf 'work_root=%s\n' "$work" >> "$GITHUB_OUTPUT"
          if [ -n "${ORCHESTRATOR_REF:-}" ]; then
            git -C "$releases" fetch origin "${GITHUB_REF}"
            git -C "$releases" worktree add --detach "$work/releases" "$ORCHESTRATOR_REF"
          else
            git -C "$releases" fetch origin "+refs/tags/${tag}:refs/tags/${tag}"
            git -C "$releases" worktree add --detach "$work/releases" "$tag"
          fi
      - name: Freeze macOS Native sources
        if: runner.os == 'macOS' && inputs.channel == 'native'
        working-directory: ${{ steps.snapshot.outputs.work_root }}
        shell: bash
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: node releases/scripts/ci/macos-ffmpeg-inputs.js prepare "$PWD" "$RELEASE_TAG" "$WORK_SUFFIX"
      - name: Download pinned macOS FFmpeg inputs
        if: runner.os == 'macOS' && inputs.channel == 'native'
        working-directory: ${{ steps.snapshot.outputs.work_root }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GPR_TOKEN }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: node releases/scripts/ci/macos-ffmpeg-inputs.js download "$PWD" "$RELEASE_TAG" "$WORK_SUFFIX"
      - name: Run tagged orchestrator
        shell: bash
        env:
          BUILDX_BUILDER: ${{ steps.desktop-buildx.outputs.name || steps.buildx.outputs.name }}
          INITIALIZE_CATALOG: ${{ inputs.initialize_catalog }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_PUBLISH_ROLE_ARN: ${{ inputs.channel == 'desktop' && vars.DESKTOP_PUBLISH_ROLE_ARN || '' }}
          RUNTIME_PUBLISH_ROLE_ARN: ${{ (inputs.channel == 'native' || inputs.channel == 'install') && vars.RUNTIME_PUBLISH_ROLE_ARN || '' }}
          NATIVE_INSTALL_PUBLISH_ROLE_ARN: ${{ (inputs.channel == 'install' || inputs.channel == 'compose') && vars.NATIVE_INSTALL_PUBLISH_ROLE_ARN || '' }}
          APPLE_TEAM_ID: ${{ inputs.channel == 'desktop' && inputs.work_suffix == 'macos' && vars.APPLE_TEAM_ID || '' }}
          RUNTIME_CATALOG_PRIVATE_KEY_B64: ${{ inputs.channel == 'native' && secrets.RUNTIME_CATALOG_PRIVATE_KEY_B64 || '' }}
          APPLE_CSC_LINK: ${{ (inputs.channel == 'native' || (inputs.channel == 'desktop' && inputs.work_suffix == 'macos')) && secrets.APPLE_CSC_LINK || '' }}
          APPLE_CSC_KEY_PASSWORD: ${{ (inputs.channel == 'native' || (inputs.channel == 'desktop' && inputs.work_suffix == 'macos')) && secrets.APPLE_CSC_KEY_PASSWORD || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.channel == 'desktop' && secrets.UPDATER_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.channel == 'desktop' && secrets.UPDATER_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.channel == 'desktop' && inputs.work_suffix == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ inputs.channel == 'desktop' && inputs.work_suffix == 'macos' && secrets.APPLE_ID_PASSWORD || '' }}
          SSL_COM_USERNAME: ${{ (inputs.channel == 'native' || (inputs.channel == 'desktop' && inputs.work_suffix == 'windows')) && secrets.SSL_COM_USERNAME || '' }}
          SSL_COM_PASSWORD: ${{ (inputs.channel == 'native' || (inputs.channel == 'desktop' && inputs.work_suffix == 'windows')) && secrets.SSL_COM_PASSWORD || '' }}
          SSL_COM_CREDENTIAL_ID: ${{ (inputs.channel == 'native' || (inputs.channel == 'desktop' && inputs.work_suffix == 'windows')) && secrets.SSL_COM_CREDENTIAL_ID || '' }}
          SSL_COM_TOTP_SECRET: ${{ (inputs.channel == 'native' || (inputs.channel == 'desktop' && inputs.work_suffix == 'windows')) && secrets.SSL_COM_TOTP_SECRET || '' }}
          DOCKERHUB_USERNAME: ${{ inputs.channel == 'native' && (inputs.work_suffix == 'linux-arm64' || inputs.work_suffix == 'linux-x64') && secrets.DOCKERHUB_USERNAME || '' }}
          DOCKERHUB_TOKEN: ${{ inputs.channel == 'native' && (inputs.work_suffix == 'linux-arm64' || inputs.work_suffix == 'linux-x64') && secrets.DOCKERHUB_TOKEN || '' }}
        run: |
          set -euo pipefail
          mhome="${MHOME_ROOT:-$HOME/.mhome}"
          work_id="${GITHUB_RUN_ID}-${WORK_SUFFIX:-$GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          work="$mhome/work/$work_id"
          export WORK_ID="$work_id" WORK_ROOT="$work" RELEASES_DIR="$work/releases" MHOME_ROOT="$mhome"
          if [ "$RELEASE_CHANNEL" = native ] && [ "$(uname -s)" = Darwin ]; then
            bash "$RELEASES_DIR/scripts/ci/run.sh" --prepared-macos
          else
            bash "$RELEASES_DIR/scripts/ci/run.sh"
          fi
      - name: Clean owned release worktrees
        if: always() && steps.snapshot.outputs.work_root != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = Darwin ]; then
            export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          fi
          mhome="${MHOME_ROOT:-$HOME/.mhome}"
          work="$mhome/work/${GITHUB_RUN_ID}-${WORK_SUFFIX:-$GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          if [ -f "$work/releases/scripts/ci/cleanup-release-sources.js" ]; then
            node "$work/releases/scripts/ci/cleanup-release-sources.js" "$work"
          elif [ -d "$work" ]; then
            rmdir "$work"
          fi
