name: Check fixed Dev sources on Linux
run-name: Platform check (${{ inputs.platform }})

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Independent target platform (does not gate Mac Beta)
        type: choice
        options: [linux-x64, linux-arm64]
        required: true
      sources:
        description: Frozen schemaVersion 1 Dev profile JSON (t tags and full SHAs)
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.platform == 'linux-arm64' && fromJSON('["self-hosted","Linux","ARM64","release-linux-arm64"]') || fromJSON('["self-hosted","Linux","AMD64","release-linux-amd64"]') }}
    timeout-minutes: 180
    concurrency:
      group: ${{ inputs.platform == 'linux-arm64' && 'plugin-linux-arm64' || 'plugin-linux-amd64' }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Prepare the exact check implementation
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          repo="$HOME/.mhome/releases"
          test -e "$repo/.git" || { echo "Provision ~/.mhome/releases before CI" >&2; exit 1; }
          git -C "$repo" fetch --no-tags --no-write-fetch-head origin "$GITHUB_SHA"
          work="$RUNNER_TEMP/platform-check-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$work"
          echo "directory=$work" >> "$GITHUB_OUTPUT"
          git -C "$repo" worktree add --detach "$work" "$GITHUB_SHA"
          [[ "$(git -C "$work" rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check pinned products without publishing
        id: products
        shell: bash
        run: |
          set -euo pipefail
          node '${{ steps.tools.outputs.directory }}/scripts/ci/platform-check.js' \
            --event "$GITHUB_EVENT_PATH" --work-id "platform-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Remove owned product sources even after cancellation
        if: always() && steps.products.outputs.source-root != ''
        shell: bash
        run: |
          node '${{ steps.tools.outputs.directory }}/scripts/ci/cleanup-release-sources.js' \
            '${{ steps.products.outputs.source-root }}'
      - name: Remove the owned check implementation
        if: always() && steps.tools.outputs.directory != ''
        shell: bash
        run: |
          set -euo pipefail
          work='${{ steps.tools.outputs.directory }}'
          if [ -f "$work/.git" ]; then
            git -C "$HOME/.mhome/releases" worktree remove --force "$work"
          else
            rmdir "$work"
          fi
