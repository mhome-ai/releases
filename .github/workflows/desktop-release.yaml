name: Release Tauri app

on:
  push:
    tags:
      - "am[0-9]*"
      - "aw[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Product tag, for example am1.2.3"
        required: true
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  macos:
    if: ${{ startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'am') }}
    uses: ./.github/workflows/run-tagged.yaml
    with:
      runner_labels: '["self-hosted","macOS","ARM64","release-macos-primary"]'
      channel: desktop
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      work_suffix: macos
    secrets: inherit

  windows:
    if: ${{ startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'aw') }}
    uses: ./.github/workflows/run-tagged.yaml
    with:
      runner_labels: '["self-hosted","Windows","X64"]'
      channel: desktop
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      work_suffix: windows
    secrets: inherit
