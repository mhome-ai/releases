name: Release Matter ESP32-C5 firmware

on:
  push:
    tags:
      - "mec5[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example mec520261026-01 (requires source t20261026-01)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/run-tagged-matter.yaml
    concurrency:
      group: native-runtime-stable-macos
      cancel-in-progress: false
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      event_commit: ${{ github.event_name == 'push' && github.sha || '' }}
    secrets: inherit
