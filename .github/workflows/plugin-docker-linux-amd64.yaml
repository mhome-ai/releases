name: Release plugin appliances linux-x64

on:
  push:
    tags:
      - "pdlx[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Product tag, for example pdlx20261001121600"
        required: true
        type: string
      initialize_catalog:
        description: "Initialize a missing Plugin Catalog"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  run:
    uses: ./.github/workflows/run-tagged-plugin.yaml
    concurrency:
      group: linux-docker-host
      cancel-in-progress: false
    with:
      runner_labels: '["self-hosted","Linux","AMD64","release-linux-amd64"]'
      channel: plugin-docker
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      initialize_catalog: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_catalog || false }}
      orchestrator_ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
      work_suffix: linux-x64
    secrets: inherit
