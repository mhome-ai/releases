name: Deploy Native Install Script

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Product version whose baycat vX.Y.Z supplies the installer"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/run-tagged.yaml
    environment: native-install
    with:
      runner_labels: '["self-hosted","Linux","ARM64","release-linux-arm64"]'
      channel: install
      tag: ${{ inputs.version }}
      orchestrator_ref: ${{ github.sha }}
      work_suffix: install
    secrets: inherit
