name: Build and publish verified Matter firmware

on:
  workflow_call:

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64, release-macos-primary]
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Prepare the tagged release orchestrator
        shell: bash
        run: |
          set -euo pipefail
          export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 GIT_TERMINAL_PROMPT=0
          tag="$(node - "$GITHUB_EVENT_PATH" "$GITHUB_EVENT_NAME" <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const name = process.argv[3];
          let tag;
          if (name === 'workflow_dispatch') tag = event.inputs?.tag || '';
          else if (name === 'push') tag = (event.ref || '').replace(/^refs\/tags\//, '');
          else throw new Error('Expected a tag push or workflow_dispatch');
          if (!/^mec5[0-9]{8}-[0-9]{2}$/.test(tag)) throw new Error('Invalid Matter release tag');
          console.log(tag);
          NODE
          )"
          event_commit=""
          if [[ "$GITHUB_EVENT_NAME" = push ]]; then event_commit="$GITHUB_SHA"; fi
          [[ "$tag" =~ ^mec5[0-9]{8}-[0-9]{2}$ ]] || { echo "Invalid Matter release tag" >&2; exit 1; }
          repo="$HOME/.mhome/releases"
          test -e "$repo/.git" || { echo "Provision ~/.mhome/releases" >&2; exit 1; }
          ref="refs/ci/matter-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'git -C "$repo" update-ref -d "$ref"' EXIT
          git -C "$repo" fetch --no-tags --no-write-fetch-head origin "+refs/tags/${tag}:$ref"
          git -C "$repo" fetch --no-tags --no-write-fetch-head origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git -C "$repo" cat-file -t "$ref")" = tag ]] || { echo "Expected an annotated release tag" >&2; exit 1; }
          revision="$(git -C "$repo" rev-parse "${ref}^{commit}")"
          git -C "$repo" merge-base --is-ancestor "$revision" origin/main
          [[ -z "$event_commit" || "$revision" = "$event_commit" ]] || { echo "Release tag moved after trigger" >&2; exit 1; }
          work_id="${GITHUB_RUN_ID}-matter-esp32c5-${GITHUB_RUN_ATTEMPT}"
          work="$HOME/.mhome/work/$work_id"
          test ! -e "$work" || { echo "Work directory already exists" >&2; exit 1; }
          mkdir -p "$work"
          tag_object="$(git -C "$repo" rev-parse "$ref")"
          git -C "$repo" worktree add --detach "$work/releases" "$revision"
          node - "$work/matter-invocation.json" "$tag" "$work_id" "$tag_object" <<'NODE'
          const fs = require('node:fs');
          const [file, tag, workId, orchestratorTagObject] = process.argv.slice(2);
          fs.writeFileSync(file, JSON.stringify({tag, workId, orchestratorTagObject}) + '\n', {flag: 'wx'});
          NODE
      - name: Resolve verified source and inspect existing release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$HOME/.mhome/work/${GITHUB_RUN_ID}-matter-esp32c5-${GITHUB_RUN_ATTEMPT}"
          node "$work/releases/scripts/ci/matter-release.js" prepare "$work"
      - name: Sign the embedded Node declaration
        shell: bash
        env:
          PLUGIN_CATALOG_PRIVATE_KEY_B64: ${{ secrets.PLUGIN_CATALOG_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          work="$HOME/.mhome/work/${GITHUB_RUN_ID}-matter-esp32c5-${GITHUB_RUN_ATTEMPT}"
          node "$work/releases/scripts/ci/matter-release.js" sign "$work"
      - name: Build and verify the firmware archive
        shell: bash
        run: |
          set -euo pipefail
          work="$HOME/.mhome/work/${GITHUB_RUN_ID}-matter-esp32c5-${GITHUB_RUN_ATTEMPT}"
          node "$work/releases/scripts/ci/matter-release.js" build "$work"
      - name: Verify uploaded bytes and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$HOME/.mhome/work/${GITHUB_RUN_ID}-matter-esp32c5-${GITHUB_RUN_ATTEMPT}"
          node "$work/releases/scripts/ci/matter-release.js" publish "$work"
      - name: Clean owned release worktrees
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          work="$HOME/.mhome/work/${GITHUB_RUN_ID}-matter-esp32c5-${GITHUB_RUN_ATTEMPT}"
          if [ -e "$work/releases/.git" ]; then
            node "$work/releases/scripts/ci/cleanup-release-sources.js" "$work"
          elif [ -d "$work" ]; then
            rmdir "$work"
          fi
