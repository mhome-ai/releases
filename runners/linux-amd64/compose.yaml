# Long-lived Linux amd64 build + GitHub Actions runner.
# The gitignored sibling .env only supplies RUNNER_TOKEN for first registration.
# stop/start keeps the same container + named volumes.
# `docker compose down` keeps volumes unless you pass -v.
#
# On Apple Silicon this must be Rosetta amd64 userspace, not QEMU.
# Keep volumes separate from linux-arm64-runner.

name: meow-linux-amd64-runner

services:
  runner:
    build:
      context: .
    image: meow-linux-amd64-runner:local
    platform: linux/amd64
    container_name: meow-linux-amd64-runner
    hostname: meow-linux-amd64-runner
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    group_add:
      - ${DOCKER_GID:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cargo-home:/home/runner/.cargo
      - rustup-home:/home/runner/.rustup
      - cargo-target:/home/runner/.cache/cargo-target
      - download-cache:/home/runner/.cache/mhome-downloads
      - mhome-src:/home/runner/.mhome
      - runner-ssh:/home/runner/.ssh
      - runner-software:/home/runner/actions-runner
      - runner-work:/home/runner/_work

volumes:
  cargo-home:
  rustup-home:
  cargo-target:
  download-cache:
  mhome-src:
  runner-ssh:
  runner-software:
  runner-work:
